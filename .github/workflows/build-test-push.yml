name: Lightweight CI & Deploy

on:
  push:
    branches:
      - feat/lightweight-wireproxy-ipv6
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'start-wireproxy-instance.sh'
      - 'warp-common.sh'
      - 'watchdog.sh'
      - 'healthcheck/**'
      - 'admin/**'
      - 'tests/**'
      - 'docker-compose.yml'
      - 'docker-compose.dokploy.yml'
      - '.github/workflows/build-test-push.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Trigger deployment webhook after CI'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  TEST_TAG: warp-multi-ips-lightweight-ci:${{ github.sha }}

concurrency:
  group: warp-lightweight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate lightweight stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n entrypoint.sh
          bash -n start-wireproxy-instance.sh
          bash -n warp-common.sh
          bash -n watchdog.sh
          bash -n healthcheck/index.sh
          bash -n healthcheck/connected-to-warp.sh

      - name: Python compile
        run: |
          set -euo pipefail
          python3 -m py_compile admin/server.py
          python3 -m compileall -q tests

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Compose validation
        run: |
          set -euo pipefail
          ADMIN_PASSWORD='CiPassword-123456!' docker compose -f docker-compose.yml config >/tmp/compose.yml
          ADMIN_PASSWORD='CiPassword-123456!' docker compose -f docker-compose.dokploy.yml config >/tmp/compose-dokploy.yml

      - name: Guard against legacy engine regression
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='README.md' --exclude='*.pyc'             '(warp-svc|warp-cli|WARP_ENGINE=(official|wireproxy)|DBUS_SYSTEM_BUS_ADDRESS)'             Dockerfile entrypoint.sh start-wireproxy-instance.sh warp-common.sh watchdog.sh healthcheck admin docker-compose*.yml; then
            echo 'Legacy official-engine runtime reference detected.'
            exit 1
          fi

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Verify lightweight binaries and no official daemon
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "${TEST_TAG}" -lc '
            test -x /usr/bin/wgcf
            test -x /usr/bin/wireproxy
            test -x /usr/bin/gost
            ! command -v warp-svc
            ! command -v warp-cli
            wgcf --help >/dev/null
            echo "lightweight image OK"
          '

      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  deploy:
    name: Trigger EasyPanel / Dokploy rebuild
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy }}" != "true" ]; then
            echo "Deployment intentionally skipped by workflow input."
            exit 0
          fi

          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "::notice title=Deployment webhook not configured::Add repository secret DEPLOY_WEBHOOK_URL once. CI/build completed successfully, but remote rebuild was not triggered."
            exit 0
          fi

          echo "Triggering remote rebuild for commit ${GITHUB_SHA}..."
          http_code="$(curl --silent --show-error --fail-with-body             --retry 3 --retry-delay 5 --retry-all-errors             -o /tmp/deploy-response.txt             -w '%{http_code}'             -X POST "${DEPLOY_WEBHOOK_URL}")"

          cat /tmp/deploy-response.txt || true
          case "${http_code}" in
            2*) echo "Deployment webhook accepted (HTTP ${http_code})." ;;
            *)  echo "Deployment webhook failed (HTTP ${http_code})."; exit 1 ;;
          esac
