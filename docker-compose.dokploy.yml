services:
  warp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "2080-2124:2080-2124"
      - "9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.warp-admin.rule=Host(`warp.funilix.ia.br`)"
      - "traefik.http.routers.warp-admin.entrypoints=websecure"
      - "traefik.http.routers.warp-admin.tls=true"
      - "traefik.http.routers.warp-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.warp-admin.service=warp-admin"
      - "traefik.http.services.warp-admin.loadbalancer.server.port=9090"
    environment:
      - ADMIN_ENABLED=true
      - ADMIN_PORT=9090
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      default:
      dokploy-network:
        aliases:
          - omniroute_warp-proxy
          - omniroute_warp-proxy_undefined
      omniroute-network:
        aliases:
          - omniroute_warp-proxy

volumes:
  warp-data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
  omniroute-network:
    external: true
    name: omniroute-0vwsth_default
