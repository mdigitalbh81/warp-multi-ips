services:
  warp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "2080-2124:2080-2124"
      - "9090:9090"
    environment:
      - WARP_INSTANCES=${WARP_INSTANCES:-10}
      - PROXY_MODE=${PROXY_MODE:-dedicated}
      - PROXY_BASE_PORT=${PROXY_BASE_PORT:-2080}
      - PROXY_MAX_CONN=${PROXY_MAX_CONN:-200}
      - PROXY_MAX_RPS=${PROXY_MAX_RPS:-50}
      - WARP_CONNECT_TIMEOUT=${WARP_CONNECT_TIMEOUT:-90}
      - LIGHTWEIGHT_EGRESS_FAMILY=${LIGHTWEIGHT_EGRESS_FAMILY:-ipv6}
      - LIGHTWEIGHT_REQUIRE_UNIQUE_EGRESS=${LIGHTWEIGHT_REQUIRE_UNIQUE_EGRESS:-true}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
      - ADMIN_PORT=${ADMIN_PORT:-9090}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PROXY_HOST_OMNIROUTE=${PROXY_HOST_OMNIROUTE:-omniroute_warp-proxy}
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      - default
      - dokploy-network
      - omniroute-network

volumes:
  warp-data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
  omniroute-network:
    external: true
    name: omniroute-0vwsth_default
