services:
  warp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "2080-2124:2080-2124"
      - "9090:9090"
    environment:
      - ADMIN_ENABLED=true
      - ADMIN_PORT=9090
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      default:
      easypanel:
        aliases:
          - omniroute_warp-proxy

volumes:
  warp-data:

networks:
  easypanel:
    external: true
